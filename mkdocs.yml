site_name: System1-Omni
site_url: https://thinkflowlab.github.io/system1-omni/
repo_url: https://github.com/ThinkFlowLab/system1-omni
edit_uri: edit/main/
# The recipes run their workers on port 8000.
dev_addr: 127.0.0.1:8001

theme:
  name: material
  features:
    - content.action.edit
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - search.highlight

# docs/hooks.py builds the site from the repository root, so each page keeps its
# repository path and relative links work here as they do on GitHub.
hooks:
  - docs/hooks.py
# The published files; assets/ is the theme's. Nothing in hidden directories.
exclude_docs: |
  *
  !/README.md
  !/CONTRIBUTING.md
  !/docs/**/*.md
  !/docs/assets/**
  !/recipe/**/*.md
  !/src/frontend/README.md
  !/src/runtime/README.md
  !/assets/**
  **/.*/**

validation:
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - toc:
      permalink: true
      # Heading anchors as GitHub makes them.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.superfences

nav:
  - Overview: README.md
  - First decision on CPU: docs/getting-started.md
  - 中文入口: docs/getting-started.zh.md
  - Architecture and contracts: docs/architecture.md
  - Supported models and hardware: docs/supported-models.md
  - Frontend: src/frontend/README.md
  - Native runtime: src/runtime/README.md
  - Optimization notes:
      - docs/blog/README.md
      - Open-Jev on H200: docs/blog/2026-10-05-open-jev-optimization.md
  - Recipes:
      - recipe/README.md
      - Laya text worker: recipe/laya/README.md
      - Laya native CUDA worker: recipe/laya/native/README.md
      - Laya CUDA validation: recipe/laya/native/VALIDATION.md
      - Laya CPU reproduction and demo: recipe/laya/validation.md
      - Laya on Apple Silicon: recipe/laya/apple-silicon.md
      - Cua-S1 text worker: recipe/cua_s1/text.md
      - Cua-S1 native text worker: recipe/cua_s1/native.md
      - Valen reference worker: recipe/valen/reference.md
      - Open-Jev native text worker: recipe/open_jev/native.md
      - Open-Jev H200 validation: recipe/open_jev/validation.md
      - CLM stub-encoder contract: recipe/clm/README.md
  - Contributing: CONTRIBUTING.md
