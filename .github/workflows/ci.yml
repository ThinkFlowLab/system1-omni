name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Official Laya packing parity
        env:
          LAYA_TOKENIZER: ${{ runner.temp }}/laya-tokenizer.json
          LAYA_PACKING_ORACLE: ${{ runner.temp }}/laya-packing.json
        run: |
          curl --fail --location --retry 3 \
            https://huggingface.co/convaiinnovations/laya/resolve/55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851/tokenizer/tokenizer.json \
            --output "$LAYA_TOKENIZER"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/linear3735/system1-omni/5e4dd4215c925ebd93bb9ce4097b27bd6375f7c0/recipe/laya/native/packing-golden.json \
            --output "$LAYA_PACKING_ORACLE"
          cargo test --locked -p omni-laya --test packing -- --ignored
      - name: Build
        run: cargo build --workspace --release --locked

  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r benchmarks/requirements.txt
      - run: python benchmarks/bench.py validate benchmarks/smoke.jsonl
      - run: python -m unittest discover -s tests/benchmarks -p 'test_*.py' -v
