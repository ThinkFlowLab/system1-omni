name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Frontend API tests
        run: cargo test -p omni-jev --test frontend --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --release --locked

  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r benchmarks/requirements.txt
      - run: python benchmarks/bench.py validate benchmarks/smoke.jsonl
      - run: python -m unittest discover -s tests/benchmarks -p 'test_*.py' -v

  cuda-compile:
    # Tier 2 of the contract: build every declared backend, so a kernel that
    # stops compiling cannot land. No GPU and no self-hosted runner -- nvcc
    # cross-compiles for a target it is not running on, and nothing here runs
    # what it builds. Tier 3, which does need a card, stays separate.
    #
    # The container carries nvcc and cuBLASLt. Laya exports its CUDA from
    # TileLang before compiling it, so the TileLang the recipe records is
    # installed too. The CUDA line is 13.0 because that is what
    # `recipe/laya/native/README.md` records for the native build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: nvidia/cuda:13.0.0-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip
          python3 -m pip install --no-cache-dir --break-system-packages tilelang==0.1.14
      - name: Compile every declared backend
        # Each backend is built the way the contract says it must be: run its
        # own build script with an output directory and a compute capability,
        # then require the library the manifest names. The manifests are the
        # only thing this step reads to decide what to build, so a backend
        # added anywhere under src/backends/cuda/ is covered without an edit
        # here. One failure does not stop the others: the whole set is reported.
        run: |
          python3 - <<'PY'
          import glob, json, os, subprocess, sys, tempfile

          out = tempfile.mkdtemp(prefix="cuda-build-")
          manifests = sorted(glob.glob("src/backends/cuda/*.backend.json")
                             + glob.glob("src/backends/cuda/*/*.backend.json"))
          if not manifests:
              sys.exit("no backend manifests under src/backends/cuda/")

          failed = []
          for path in manifests:
              with open(path, encoding="utf-8") as handle:
                  manifest = json.load(handle)
              name, build = manifest["name"], manifest["build"]
              arch = build["default_arch"]
              directory = os.path.dirname(os.path.abspath(path))
              target = os.path.join(out, name)
              os.makedirs(target, exist_ok=True)
              print("== %s: %s -> %s (sm_%s)" % (name, build["script"], build["output"], arch), flush=True)
              script = os.path.join(directory, build["script"])
              code = subprocess.run([script, target, str(arch)], cwd=directory).returncode
              if code != 0:
                  print("   exited %d" % code, flush=True)
                  failed.append(name)
              elif not os.path.isfile(os.path.join(target, build["output"])):
                  print("   %s was not produced" % build["output"], flush=True)
                  failed.append(name)

          if failed:
              sys.exit("did not build: " + ", ".join(failed))
          print("\nbuilt %d backend(s)" % len(manifests))
          PY
