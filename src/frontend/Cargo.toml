[package]
name = "omni-jev"
version = "0.1.0"
edition = "2024"
publish = false
description = "Model-independent HTTP frontend for Jev-style decision workers"

[dependencies]
axum = "0.8"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["io-util", "process", "time"] }

[[test]]
name = "forwarding_limits"
path = "../../tests/frontend/forwarding_limits.rs"
