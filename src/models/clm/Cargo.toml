[package]
name = "omni-clm"
version = "0.1.0"
edition = "2024"
publish = false
description = "CLM: projection heads, typed decision scoring and the embeddings client"

[dependencies]
anyhow = "1"
# The embeddings payload is base64 f32; reqwest already pulls this in, so it is free.
base64 = "0.22"
memmap2 = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps object key order, which to_text depends on: the heads are
# trained on the caller's field order, so re-sorting a state would change the text.
# float_roundtrip: a float literal must parse to the same double `json.loads`
#   produces, or the heads see a different number.
# raw_value: a rendered field keeps the text it arrived as, so an integer literal
#   above u64::MAX keeps every digit. It adds `RawValue` and does not change how
#   `Number` behaves, unlike `arbitrary_precision`, which would reach every crate
#   in the workspace.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "raw_value"] }
sha2 = "0.10"

# Test bodies live under the repository-level tests/ tree; this is the explicit
# registration CONTRIBUTING asks for, matching src/models/laya/Cargo.toml.
[[test]]
name = "checkpoint"
path = "../../../tests/clm/checkpoint.rs"

[[test]]
name = "text"
path = "../../../tests/clm/text.rs"
