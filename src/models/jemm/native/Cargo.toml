[package]
name = "omni-jemm-native"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
sha2 = "0.10.9"
anyhow = "1.0.100"
axum = "0.8.8"
base64 = "0.22.1"
half = "2.7.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
safetensors = "0.8.0"
omni-qwen3-5-native = { path = "../../qwen3_5/native" }
omni-runtime = { path = "../../../runtime" }
serde_json = { version = "1.0.149", features = ["float_roundtrip", "preserve_order"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "sync"] }

[[test]]
name = "contract"
path = "../../../../tests/jemm/contract.rs"

[[test]]
name = "processing"
path = "../../../../tests/jemm/processing.rs"

[[test]]
name = "head"
path = "../../../../tests/jemm/head.rs"

[[test]]
name = "artifacts"
path = "../../../../tests/jemm/artifacts.rs"

[[test]]
name = "tokenization"
path = "../../../../tests/jemm/tokenization.rs"
