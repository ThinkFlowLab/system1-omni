[package]
name = "omni-omnijev-native"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native /v1/systemone worker for OmniJev-4B v1.1"

[[bin]]
name = "omni-omnijev-native"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.8"
base64 = "0.22.1"
half = "2.7.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libm = "0.2"
# the CUDA kernels live in libqwen3_5_cuda.so, loaded at run time
omni-qwen3-5-native = { path = "../../qwen3_5/native" }
omni-runtime = { path = "../../../runtime" }
safetensors = "0.8.0"
serde_json = { version = "1.0.149", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.10"
# the onig regex backend, as in the Python tokenizers wheel
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "sync"] }

[[test]]
name = "contract"
path = "../../../../tests/omnijev/contract.rs"

[[test]]
name = "processing"
path = "../../../../tests/omnijev/processing.rs"

[[test]]
name = "finish"
path = "../../../../tests/omnijev/finish.rs"

[[test]]
name = "heads"
path = "../../../../tests/omnijev/heads.rs"

[[test]]
name = "export"
path = "../../../../tests/omnijev/export.rs"

[[test]]
name = "pixels"
path = "../../../../tests/omnijev/pixels.rs"

[[test]]
name = "worker"
path = "../../../../tests/omnijev/worker.rs"
