[package]
name = "omni-laya"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
half = "2"
memmap2 = "0.9"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"

[[test]]
name = "checkpoint"
path = "../../../tests/laya/checkpoint.rs"

[[test]]
name = "weights"
path = "../../../tests/laya/weights.rs"

[[test]]
name = "preprocess"
path = "../../../tests/laya/preprocess.rs"

[[test]]
name = "packing"
path = "../../../tests/laya/packing.rs"

[[test]]
name = "decision"
path = "../../../tests/laya/decision.rs"
